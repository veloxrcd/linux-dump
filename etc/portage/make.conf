# ---- Compiler: Whiskey Lake (i7-8665U), -O2 kept ----
COMMON_FLAGS="-march=native -O2 -pipe -fno-plt"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="-Wl,-O1 -Wl,--as-needed"
RUSTFLAGS="-C target-cpu=native -C opt-level=2"

# ---- Parallelism (-j7 unchanged) ----
MAKEOPTS="-j7 -l7"
NINJAOPTS="-j7 -l7"
EMERGE_DEFAULT_OPTS="--jobs=1 --load-average=6.5 --keep-going --with-bdeps=n --quiet-build=n"

# CPU_FLAGS_X86 lives in /etc/portage/package.use/00cpu-flags (auto-detected)

# ---- USE ----
USE="X acpi alsa bluetooth dbus egl elogind fprint gbm gles2 gnome-keyring gtk hwaccel iwd libinput lm-sensors opengl pipewire pulseaudio qt6 screencast sound-server thinkpad udisks upower usb vaapi vulkan wayland wifi xwayland zstd \
     -systemd -networkmanager -vdpau -wext -cups -gnome -kde -plasma -doc -gtk-doc -examples"

ABI_X86="64 32"
VIDEO_CARDS="intel"
INPUT_DEVICES="libinput"

ACCEPT_KEYWORDS="~amd64"
ACCEPT_LICENSE="*"
GRUB_PLATFORMS="efi-64"
L10N="en-GB en-US"
LC_MESSAGES=C.utf8

# ---- Portage: gentle on the laptop, no binpkgs, no tmpfs ----
FEATURES="parallel-fetch parallel-install ccache"
CCACHE_SIZE="5G"
PORTAGE_NICENESS=10
PORTAGE_IONICE_COMMAND="ionice -c 3 -p \${PID}"
