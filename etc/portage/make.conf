# ==============================================================================
# 1. COMPILER & LINKER FLAGS (Whiskey Lake i7-8665U | Native Performance)
# ==============================================================================
COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# GNU ELF hashing + dead-code removal; append -fuse-ld=mold after emerging sys-devel/mold
LDFLAGS="-Wl,-O1 -Wl,--as-needed -Wl,--hash-style=gnu -Wl,--sort-common"

# Rust: native CPU instructions, fast optimization, strip debug symbols to cut disk I/O
RUSTFLAGS="-C target-cpu=native -C opt-level=2 -C strip=symbols -C debuginfo=0"

# ==============================================================================
# 2. PARALLELISM & THERMAL/UI RESPONSIVENESS (4 Cores / 8 Threads)
# ==============================================================================
# Use 6 of 8 threads so Wayland, XWayland, and Steam never stutter during heavy builds
MAKEOPTS="-j6 -l5.5"
NINJAOPTS="-j6 -l5.5"
EMERGE_DEFAULT_OPTS="--jobs=1 --load-average=5.5 --keep-going --with-bdeps=n --verbose --ask-enter-invalid"

# Lowest possible CPU & Disk I/O priority so interactive windows always win
PORTAGE_NICENESS="19"
PORTAGE_IONICE_COMMAND="ionice -c 3 -p \${PID}"

# ==============================================================================
# 3. TARGET HARDWARE & SINGLE-ARCHITECTURE STRIPPING
# ==============================================================================
# Compile backends/drivers ONLY for x86_64 and Intel UHD 620 (Gen 9.5 uses iris)
LLVM_TARGETS="X86"
VIDEO_CARDS="intel iris"
INPUT_DEVICES="libinput"
GRUB_PLATFORMS="efi-64"
QEMU_SOFTMMU_TARGETS="x86_64"
QEMU_USER_TARGETS="x86_64"

# Strictly 64-bit globally; 32-bit is enabled ONLY for Steam's ~50 deps in /etc/portage/package.use/
ABI_X86="64"

# ==============================================================================
# 4. ECOSYSTEM DEFAULTS (Let Profile Manage Python/Lua/Ruby Upgrades Cleanly)
# ==============================================================================
CURL_SSL="openssl"

# ==============================================================================
# 5. GLOBAL USE FLAGS (Lean ThinkPad Wayland + XWayland + PipeWire)
# ==============================================================================
USE="X acpi alsa bluetooth dbus egl elogind fprint gbm gles2 gnome-keyring hwaccel \
     iwd libinput lm-sensors opengl pipewire screencast sound-server \
     threads thinkpad udev udisks upower usb vaapi vulkan wayland wifi xwayland zstd \
     -systemd -networkmanager -pulseaudio -jack -oss -vdpau -nvenc -cuda -opencl \
     -wext -cups -sane -scanner -gnome -kde -plasma -xfce -mate -lxqt \
     -debug -test -doc -gtk-doc -examples -man -info -nls -bindist -telemetry"

# ==============================================================================
# 6. PORTAGE FEATURES, CCACHE & BUILD HYGIENE
# ==============================================================================
# Source-only builds, ccache acceleration, auto-cleanup of build dirs, and collision safety
FEATURES="parallel-fetch parallel-install ccache fail-clean \
          collision-protect strict unmerge-orphans merge-sync -getbinpkg"

CCACHE_SIZE="20G"
CCACHE_DIR="/var/cache/ccache"

# Compress man pages & build logs cleanly with zstd
PORTAGE_COMPRESS="zstd"
PORTAGE_COMPRESS_FLAGS="-19 -T0"
PORTAGE_ELOG_CLASSES="warn error log"
PORTAGE_ELOG_SYSTEM="save"

# ==============================================================================
# 7. REPOSITORIES, KEYWORDS & UK MIRRORS
# ==============================================================================
ACCEPT_KEYWORDS="~amd64"
ACCEPT_LICENSE="*"
L10N="en-GB en-US"
LC_MESSAGES=C.utf8
GENTOO_MIRRORS="https://www.mirrorservice.org/sites/distfiles.gentoo.org/ https://distfiles.gentoo.org/"
