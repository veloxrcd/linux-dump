[main]
term=xterm-256color
font=Iosevka Nerd Font:size=12.5
pad=20x16 center
initial-window-mode=windowed
selection-target=clipboard

[scrollback]
lines=20000
multiplier=3.0

[cursor]
style=beam
beam-thickness=1.6
blink=yes

[mouse]
hide-when-typing=yes

[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
spawn-terminal=Control+Shift+n
search-start=Control+Shift+f

[colors-dark]
alpha=0.85
background=080808
foreground=ffffff

# Cursor colors: <text-color> <cursor-color>
cursor=000000 ffffff

# Inverted stark selection
selection-foreground=000000
selection-background=ffffff

# URLs underline highlight
urls=cccccc

regular0=1c1c1c
regular1=666666
regular2=888888
regular3=aaaaaa
regular4=cccccc
regular5=dddddd
regular6=eeeeee
regular7=ffffff

bright0=3a3a3a
bright1=888888
bright2=aaaaaa
bright3=cccccc
bright4=dddddd
bright5=eeeeee
bright6=ffffff
bright7=ffffff
